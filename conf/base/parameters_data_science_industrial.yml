outliers_industrial:
  features:
    target: c_yearly_margin_per_liter
  z_score_threshold: 2.3 # 3
  base_quantile:
    lower_quantile: 0
    upper_quantile: 0.975
first_stage_industrial:
  cross_validation:
    cv_folds: 5
    scoring:
      rmse: neg_root_mean_squared_error
      mae: neg_mean_absolute_error
      r2: r2
      mape: neg_mean_absolute_percentage_error
  filter:
    threshold: 0.00 # 0.01 A mayor numero mas en Top Performers
    use_minimum_margin:
      enabled: False
      min_margin_threshold: 10
      min_volume_threshold: 5000000
  algorithms:
    # - lightgbm
    - catboost
  optimize_hyperparams: False
  features:
    target: c_yearly_margin_per_liter
    categorical:
    numerical:
      comma_columns:
        - total_volume
      percent_columns:
        - planta_share_1627
        - planta_share_1205
        - planta_share_1210
        - planta_share_1204
        - planta_share_1228
        - planta_share_1208
        - planta_share_1212
        - planta_share_1215
        - planta_share_SIN INFORMACION
        - planta_share_1211
        - planta_share_1207
        - planta_share_1206
        - planta_share_1201
        - planta_share_1202
        - planta_share_1216
        - planta_share_1214
        - planta_share_1213
        - planta_share_1203
        - planta_share_1566
        - rubro_share_6
        - rubro_share_7
        - rubro_share_others
        - rubro_share_26
        - rubro_share_22
        - rubro_share_24
        - rubro_share_27
        - rubro_share_15
        - rubro_share_29
  hyperparameters:
    metric: mae
    n_trials: 30
    n_splits: 5
    catboost:
      depth:
        type: int
        low: 10 #2
        high: 14 #6      # allow deeper trees
      learning_rate:
        type: float
        low: 0.1 # allow slower learning
        high: 0.3
      l2_leaf_reg:
        type: int
        low: 1 # avoid extremely low values
        high: 5 # stronger regularization allowed
      iterations:
        type: int
        low: 1000
        high: 2000
second_stage_industrial:
  cross_validation:
    cv_folds: 5
    scoring:
      rmse: neg_root_mean_squared_error
      mae: neg_mean_absolute_error
      r2: r2
      mape: neg_mean_absolute_percentage_error
  algorithms:
    # - lightgbm
    - catboost
  optimize_hyperparams: False
  features:
    target: c_yearly_margin_per_liter
    categorical:
    numerical:
      comma_columns:
        - total_volume
      percent_columns:
        - planta_share_1627
        - planta_share_1205
        - planta_share_1210
        - planta_share_1204
        - planta_share_1228
        - planta_share_1208
        - planta_share_1212
        - planta_share_1215
        - planta_share_SIN INFORMACION
        - planta_share_1211
        - planta_share_1207
        - planta_share_1206
        - planta_share_1201
        - planta_share_1202
        - planta_share_1216
        - planta_share_1214
        - planta_share_1213
        - planta_share_1203
        - planta_share_1566
        - rubro_share_6
        - rubro_share_7
        - rubro_share_others
        - rubro_share_26
        - rubro_share_22
        - rubro_share_24
        - rubro_share_27
        - rubro_share_15
        - rubro_share_29
  hyperparameters:
    metric: mae
    n_trials: 30
    n_splits: 5
    catboost:
      depth:
        type: int
        low: 4
        high: 6  # shallower trees
      learning_rate:
        type: float
        low: 0.01
        high: 0.05  # slower learning
      l2_leaf_reg:
        type: int
        low: 5
        high: 10  # stronger regularization
      iterations:
        type: int
        low: 500
        high: 1000  # let early stopping handle training length